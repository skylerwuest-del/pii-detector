name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.9,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt
      # The Tesseract program is needed for the OCR tests (they skip without it).
      - name: Install Tesseract OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract OCR (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install tesseract -y --no-progress
      # Windows runners also execute the junction-boundary and drive-discovery tests.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic demo (never scans real drives)
        run: python demo.py
      - name: Command-line smoke test
        run: |
          python main.py scan synthetic_demo --top 3
          python main.py results --high
          python main.py report --no-open
